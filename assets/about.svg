  <text x="40" y="348" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="700" fill="#3DFFA2" opacity="0">$ <animate attributeName="opacity" from="0" to="1" begin="3.35s" dur="0.01s" fill="freeze"/></text>
  <rect x="62" y="334" width="10" height="20" fill="#00D9FF" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.35s" dur="0.01s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="1s" begin="3.35s" repeatCount="indefinite" calcMode="discrete"/></rect>
