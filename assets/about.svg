  </g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.30s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" begin="2.30s" dur="0.4s" fill="freeze"/>
