<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 58" width="1000" height="58" role="img" aria-label="TECH STACK">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#00D9FF"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#7B2FF7"/></linearGradient>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00D9FF" stop-opacity="0"/><stop offset="0.5" stop-color="#00D9FF"/><stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/></linearGradient>
    <clipPath id="rc"><rect x=".5" y=".5" width="999" height="57" rx="10"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="999" height="57" rx="10" fill="#0a0f1e" stroke="#1c2a4a"/>
  <g clip-path="url(#rc)">
    <rect width="6" height="58" fill="url(#bar)"/>
    <rect y="56" width="1000" height="1" fill="#1c2a4a"/>
    <rect x="-260" y="55" width="260" height="3" fill="url(#sw)"><animate attributeName="x" values="-260;1000" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <text x="30" y="35" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#00D9FF" fill-opacity="0.85">02</text>
  <text x="68" y="36" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="url(#tg)">TECH STACK</text>
  <text x="968" y="35" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2" fill="#7d8aa8">// toolbox</text>
</svg>
