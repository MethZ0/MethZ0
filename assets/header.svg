<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Methush Anjula - Software Engineer and Animator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0d1330"/></linearGradient>
    <linearGradient id="ng" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="430" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#00D9FF"/><stop offset="1" stop-color="#7B2FF7"/></linearGradient>
    <linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="950" y2="0"><stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#7B2FF7"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#7B2FF7"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#00D9FF" stop-opacity="0.22"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#7B2FF7" stop-opacity="0.28"/><stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00D9FF" stroke-opacity="0.06"/></pattern>
    <clipPath id="frame"><rect width="1000" height="300" rx="14"/></clipPath>
    <clipPath id="c0"><rect x="80" y="226" width="0" height="34"><animate attributeName="width" values="0.0;336.0;336.0" dur="16.0s" keyTimes="0.0000;0.1050;1.0000" repeatCount="indefinite"/></rect></clipPath><clipPath id="c1"><rect x="80" y="226" width="0" height="34"><animate attributeName="width" values="0.0;0.0;360.0;360.0" dur="16.0s" keyTimes="0.0000;0.2500;0.3550;1.0000" repeatCount="indefinite"/></rect></clipPath><clipPath id="c2"><rect x="80" y="226" width="0" height="34"><animate attributeName="width" values="0.0;0.0;336.0;336.0" dur="16.0s" keyTimes="0.0000;0.5000;0.6050;1.0000" repeatCount="indefinite"/></rect></clipPath><clipPath id="c3"><rect x="80" y="226" width="0" height="34"><animate attributeName="width" values="0.0;0.0;384.0;384.0" dur="16.0s" keyTimes="0.0000;0.7500;0.8550;1.0000" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <circle cx="820" cy="90" r="260" fill="url(#g1)"><animate attributeName="cx" values="820;760;820" dur="9s" keyTimes="0;0.5;1" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></circle>
    <circle cx="120" cy="270" r="240" fill="url(#g2)"><animate attributeName="cx" values="120;200;120" dur="11s" keyTimes="0;0.5;1" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></circle>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="14" fill="none" stroke="#1c2a4a"/>

  <!-- left: identity -->
  <text x="50" y="62" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2" fill="#7d8aa8"><tspan fill="#00D9FF">//</tspan> aka MethZo  /  SLIIT  /  Sri Lanka</text>
  <text x="50" y="135" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="3" fill="url(#ng)">METHUSH</text>
  <text x="50" y="198" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="3" fill="url(#ng)">ANJULA</text>
  <rect x="50" y="214" width="64" height="3" rx="1.5" fill="url(#ac)"/>
  <text x="50" y="250" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" fill="#00D9FF">&gt;</text>
  <g opacity="1"><animate attributeName="opacity" values="1;0;0" dur="16.0s" keyTimes="0.0000;0.2500;1.0000" repeatCount="indefinite" calcMode="discrete"/>
    <text x="80" y="250" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#e6edf3" clip-path="url(#c0)" textLength="336.0" lengthAdjust="spacing">Full-Stack Software Engineer</text>
    <rect x="80" y="232" width="10" height="22" fill="#00D9FF"><animate attributeName="x" values="80.0;416.0;416.0" dur="16.0s" keyTimes="0.0000;0.1050;1.0000" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect>
  </g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" dur="16.0s" keyTimes="0.0000;0.2500;0.5000;1.0000" repeatCount="indefinite" calcMode="discrete"/>
    <text x="80" y="250" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#e6edf3" clip-path="url(#c1)" textLength="360.0" lengthAdjust="spacing">Spring Boot  |  React  |  Java</text>
    <rect x="80" y="232" width="10" height="22" fill="#00D9FF"><animate attributeName="x" values="80.0;80.0;440.0;440.0" dur="16.0s" keyTimes="0.0000;0.2500;0.3550;1.0000" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect>
  </g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" dur="16.0s" keyTimes="0.0000;0.5000;0.7500;1.0000" repeatCount="indefinite" calcMode="discrete"/>
    <text x="80" y="250" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#e6edf3" clip-path="url(#c2)" textLength="336.0" lengthAdjust="spacing">Animator &amp; Creative Designer</text>
    <rect x="80" y="232" width="10" height="22" fill="#00D9FF"><animate attributeName="x" values="80.0;80.0;416.0;416.0" dur="16.0s" keyTimes="0.0000;0.5000;0.6050;1.0000" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect>
  </g><g opacity="0"><animate attributeName="opacity" values="0;1;1" dur="16.0s" keyTimes="0.0000;0.7500;1.0000" repeatCount="indefinite" calcMode="discrete"/>
    <text x="80" y="250" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#e6edf3" clip-path="url(#c3)" textLength="384.0" lengthAdjust="spacing">Always building, always learning</text>
    <rect x="80" y="232" width="10" height="22" fill="#00D9FF"><animate attributeName="x" values="80.0;80.0;464.0;464.0" dur="16.0s" keyTimes="0.0000;0.7500;0.8550;1.0000" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect>
  </g>

  <!-- right: motion curve (animation meets code) -->
  <line x1="600" y1="230" x2="690" y2="50" stroke="#7d8aa8" stroke-opacity="0.6" stroke-dasharray="4 4"/>
  <line x1="950" y1="70" x2="790" y2="260" stroke="#7d8aa8" stroke-opacity="0.6" stroke-dasharray="4 4"/>
  <path id="curve" d="M600 230 C690 50 790 260 950 70" fill="none" stroke="url(#cg)" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="686" y="46" width="8" height="8" fill="#060912" stroke="#00D9FF"/>
  <rect x="786" y="256" width="8" height="8" fill="#060912" stroke="#7B2FF7"/>
  <circle cx="600" cy="230" r="9" fill="none" stroke="#00D9FF" stroke-opacity="0.5"/>
  <circle cx="600" cy="230" r="4.5" fill="#00D9FF"/>
  <circle cx="950" cy="70" r="9" fill="none" stroke="#7B2FF7" stroke-opacity="0.6"/>
  <circle cx="950" cy="70" r="4.5" fill="#7B2FF7"/>
  <circle r="14" fill="#00D9FF" opacity="0.18"><animateMotion dur="4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#curve"/></animateMotion></circle>
  <circle r="6" fill="#ffffff"><animateMotion dur="4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath href="#curve"/></animateMotion></circle>
  <text x="640" y="282" font-family="'JetBrains Mono','SF Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#7d8aa8">cubic-bezier(0.4, 0, 0.2, 1)</text>
</svg>
